[cli]
installer = "internal"

[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[ui]
max_thoughts_width = 120
fork_secondary_model = "grok-4.5"
yolo = false
compact_mode = false
permission_mode = "always-approve"
vim_mode = true

[model_providers.chatgpt]
base_url = "https://chatgpt.com/backend-api/codex"
api_backend = "responses"
context_window = 272000

[model_providers.chatgpt.auth]
command = "grok-codex-token"
timeout_secs = 10

[model_providers.openai]
base_url = "https://api.openai.com/v1"
api_backend = "responses"
env_key = "OPENAI_API_KEY"
context_window = 400000

# Ox Alpha provider catalog. Keys remain machine-local environment state.
[model_providers.ox-opencode]
base_url = "https://opencode.ai/zen/v1"
api_backend = "chat_completions"
env_key = "OPENCODE_ZEN_API_KEY"
context_window = 1048576

[model_providers.ox-openrouter]
base_url = "https://openrouter.ai/api/v1"
api_backend = "chat_completions"
env_key = "OPENROUTER_API_KEY"
context_window = 1048576

[model_providers.ox-command]
base_url = "https://api.commandcode.ai/provider/v1"
api_backend = "chat_completions"
env_key = "COMMAND_CODE_API_KEY"
context_window = 1048576

[model_providers.ox-nous]
base_url = "http://127.0.0.1:8645/v1"
api_backend = "chat_completions"
env_key = "NOUS_API_KEY"
context_window = 1048576

[model_providers.ox-venice]
base_url = "https://api.venice.ai/api/v1"
api_backend = "chat_completions"
env_key = "VENICE_API_KEY"
context_window = 1048576

[model."chatgpt-gpt-5.6-sol"]
model = "gpt-5.6-sol"
name = "GPT-5.6 Sol (ChatGPT)"
description = "OpenAI Codex model using the existing ChatGPT subscription login"
model_provider = "chatgpt"
responses_system_role_developer = true

[model."chatgpt-gpt-5.6-terra"]
model = "gpt-5.6-terra"
name = "GPT-5.6 Terra (ChatGPT)"
description = "Balanced agentic coding model for everyday work"
model_provider = "chatgpt"
responses_system_role_developer = true

[model."chatgpt-gpt-5.6-luna"]
model = "gpt-5.6-luna"
name = "GPT-5.6 Luna (ChatGPT)"
description = "Fast and affordable agentic coding model"
model_provider = "chatgpt"
responses_system_role_developer = true

[model."chatgpt-gpt-5.5"]
