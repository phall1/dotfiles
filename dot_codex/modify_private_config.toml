#!/bin/sh
# chezmoi modify_ script -> ~/.codex/config.toml
#
# Two-writer reconciliation. The `lazycodex-ai` installer and Codex itself
# write machine-specific state into config.toml (hook trust hashes, project
# trust levels, marketplace caches, last_updated timestamps). chezmoi must NOT
# clobber that state -- only enforce the portable OmO + model settings below.
#
# A modify_ script receives the file's current contents on stdin and writes
# the replacement to stdout, so we MERGE our managed settings into whatever
# is already on disk instead of overwriting the file.
#
# Managed (enforced) keys win on conflict; everything else on disk -- hook
# trust hashes, project paths, marketplace caches, etc. -- is preserved.
# Requires tomlq (from brew install yq) or falls back to sed merge.

set -eu

# Portable OmO + Codex settings that should follow you across machines.
# These are the "opinionated defaults" for oh-my-openagent usage.
MANAGED_TOML='model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "danger-full-access"
network_access = "enabled"

# Ox Alpha uses the OpenAI Responses protocol only on these two gateways.
# Credentials stay in environment variables and profiles select the route.
[model_providers.ox-openrouter]
name = "OpenRouter — Ox Alpha"
base_url = "https://openrouter.ai/api/v1"
wire_api = "responses"

[model_providers.ox-openrouter.auth]
command = "printenv"
args = ["OPENROUTER_API_KEY"]
timeout_ms = 5000

[model_providers.ox-venice]
name = "Venice — Ox Alpha"
base_url = "https://api.venice.ai/api/v1"
wire_api = "responses"

[model_providers.ox-venice.auth]
command = "printenv"
args = ["VENICE_API_KEY"]
timeout_ms = 5000

[features]
goals = true
unified_exec = true
child_agents_md = true
multi_agent = true
plugin_hooks = true
plugins = true
js_repl = false

[features.multi_agent_v2]
enabled = true
max_concurrent_threads_per_session = 10000

[notice]
hide_world_writable_warning = true
hide_full_access_warning = true

[plugins."omo@sisyphuslabs"]
enabled = true

[plugins."omo@sisyphuslabs".mcp_servers.git_bash]
enabled = false

[agents.codex-ultrawork-reviewer]
config_file = "./agents/codex-ultrawork-reviewer.toml"

[agents.explorer]
config_file = "./agents/explorer.toml"

[agents.librarian]
config_file = "./agents/librarian.toml"

[agents.metis]
config_file = "./agents/metis.toml"

[agents.momus]
config_file = "./agents/momus.toml"

[agents.plan]
config_file = "./agents/plan.toml"
'

# Read current file from stdin
current="$(cat)"
[ -n "$current" ] || current=""

# SAFETY: this script's stdout becomes ~/.codex/config.toml verbatim. Emitting
# nothing truncates the file, so every path below must produce output or defer
# to the next one, and the final guard re-emits `current` unchanged if all of
# them came up empty. A broken merge must degrade to "no change", never to
# "empty config".
result=''

if command -v tomlq >/dev/null 2>&1; then
    tmpd=$(mktemp -d) || tmpd=''
    if [ -n "$tmpd" ]; then
        trap 'rm -rf "$tmpd"' EXIT INT TERM
        printf '%s\n' "$current"      > "$tmpd/current.toml"
        printf '%s\n' "$MANAGED_TOML" > "$tmpd/managed.toml"
        # Slurp both documents into an array (-s) and deep-merge left to right
        # with jq's `*`, so managed comes LAST and wins on conflict while every
        # key the tool wrote survives.
        #
        # They must be two separate inputs. Concatenating them into one stream
        # -- which this script used to do -- yields a single TOML document with
        # duplicate [features]/[notice] tables, and tomlq dies with
        # 'Key "features" already exists', printing nothing. That failure was
        # invisible for as long as tomlq wasn't installed; installing it would
        # have silently emptied the config on the next apply.
        result=$(tomlq -s -t 'reduce .[] as $i ({}; . * $i)' \
                     "$tmpd/current.toml" "$tmpd/managed.toml" 2>/dev/null) || result=''
    fi
fi

if [ -z "$result" ]; then
    # Fallback: prepend managed settings. This is "good enough" because TOML
    # uses "last key wins" semantics for duplicate top-level keys. The managed
    # block comes first, but if Codex wrote a conflicting key later in the
    # file... actually that would lose. So we need a smarter fallback.
    #
    # Better fallback: write managed first, then append current but skip
    # any lines that set keys we manage. This is imperfect but functional.
    result=$(printf '%s\n' "$MANAGED_TOML"
    # Filter out lines that would conflict with managed settings
    printf '%s\n' "$current" | awk '
        /^model[[:space:]]*=/ { next }
        /^model_reasoning_effort[[:space:]]*=/ { next }
        /^approval_policy[[:space:]]*=/ { next }
        /^sandbox_mode[[:space:]]*=/ { next }
        /^network_access[[:space:]]*=/ { next }
        /^\[model_providers\.ox-openrouter\]$/ { skip=1; next }
        /^\[model_providers\.ox-openrouter\.auth\]$/ { skip=1; next }
        /^\[model_providers\.ox-venice\]$/ { skip=1; next }
        /^\[model_providers\.ox-venice\.auth\]$/ { skip=1; next }
        /^\[features\]$/ { skip=1; next }
        /^\[features\.multi_agent_v2\]$/ { skip=1; next }
        /^\[notice\]$/ { skip=1; next }
        /^\[plugins\."omo@sisyphuslabs"\]$/ { skip=1; next }
        /^\[plugins\."omo@sisyphuslabs"\.mcp_servers\.git_bash\]$/ { skip=1; next }
        /^\[agents\.codex-ultrawork-reviewer\]$/ { skip=1; next }
        /^\[agents\.explorer\]$/ { skip=1; next }
        /^\[agents\.librarian\]$/ { skip=1; next }
        /^\[agents\.metis\]$/ { skip=1; next }
        /^\[agents\.momus\]$/ { skip=1; next }
        /^\[agents\.plan\]$/ { skip=1; next }
        skip && /^\[/ { skip=0 }
        skip { next }
        { print }
    ')
fi

# Last line of defence: never hand chezmoi an empty file.
if [ -z "$result" ]; then
    printf '%s\n' "$current"
else
    printf '%s\n' "$result"
fi
