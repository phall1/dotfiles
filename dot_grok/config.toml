[cli]
installer = "internal"

[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[ui]
max_thoughts_width = 120
fork_secondary_model = "grok-4.5"
yolo = false
compact_mode = false
permission_mode = "always-approve"
vim_mode = true

[model_providers.chatgpt]
base_url = "https://chatgpt.com/backend-api/codex"
api_backend = "responses"
context_window = 400000

[model_providers.chatgpt.auth]
command = "grok-codex-token"
timeout_secs = 10

[model."chatgpt-gpt-5.6-sol"]
model = "gpt-5.6-sol"
name = "GPT-5.6 Sol (ChatGPT)"
description = "OpenAI Codex model using the existing ChatGPT subscription login"
model_provider = "chatgpt"
responses_system_role_developer = true

[model_providers.openai]
base_url = "https://api.openai.com/v1"
api_backend = "responses"
env_key = "OPENAI_API_KEY"
context_window = 400000

[model."openai-gpt-5.6-sol"]
model = "gpt-5.6-sol"
name = "GPT-5.6 Sol (OpenAI API)"
description = "OpenAI API model using OPENAI_API_KEY"
model_provider = "openai"
max_completion_tokens = 128000
