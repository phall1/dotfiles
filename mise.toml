min_version = "2026.9.1"

# This is the portable tool inventory. Chezmoi renders the same declarations
# into the user's global mise configuration; versions have one source.
[tools]
node = "24.20.0"
bun = "1.3.14"
zig = "0.16.0"
"aqua:astral-sh/uv" = "0.12.10"
"aqua:twpayne/chezmoi" = "2.72.1"
"aqua:atuinsh/atuin" = "18.21.0"
"aqua:junegunn/fzf" = "0.74.3"
"aqua:dandavison/delta" = "0.19.2"
"aqua:ajeetdsouza/zoxide" = "0.10.0"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:cli/cli" = "2.100.0"
"aqua:sharkdp/fd" = "10.5.0"
"aqua:sharkdp/bat" = "0.26.1"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:gitui-org/gitui" = "0.28.1"
"aqua:jesseduffield/lazygit" = "0.64.1"
"github:joshmedeski/sesh" = "2.29.0"
"npm:open-websearch" = "2.1.11"

[settings]
idiomatic_version_file_enable_tools = ["node"]
# Use native npm; mise skips lifecycle scripts for these tools by default.
npm.package_manager = "npm"

[bootstrap.hooks.pre-packages]
run = "bash scripts/bootstrap/packages.sh"

[tasks.bootstrap]
description = "Materialize preferences, reconcile native integrations, and verify"
run = "bash scripts/bootstrap/converge.sh"

[tasks.configure]
description = "Select this machine's optional harnesses (e.g. mise run configure pi claude)"
run = "bash scripts/bootstrap/configure.sh"

[tasks.check]
description = "Validate source and isolated configuration convergence"
run = "bash tests/bootstrap/check.sh"

[tasks.test-container]
description = "Build and run the disposable Linux bootstrap acceptance rig"
run = "bash tests/bootstrap/container.sh"

[tasks.doctor]
run = "bash dot_local/bin/executable_dot-doctor"

[tasks.audit]
run = "bash dot_local/bin/executable_dot-audit"

[tasks.bench]
run = "bash dot_local/bin/executable_dot-bench"
